name: Release Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.0.0)'
        required: false

permissions:
  contents: write

jobs:
  tag-release:
    name: Generate Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and Push Tag
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build (${{ matrix.target }})
    needs: [tag-release]
    if: always() && (needs.tag-release.result == 'success' || needs.tag-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ox
            archive_ext: tar.gz
            use_cross: false

          # Linux x86_64 (musl static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: ox
            archive_ext: tar.gz
            use_cross: true

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: ox
            archive_ext: tar.gz
            use_cross: true

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ox
            archive_ext: tar.gz
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ox.exe
            archive_ext: zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross if needed
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Inject Version
        shell: bash
        env:
          NEW_TAG: ${{ needs.tag-release.outputs.new_tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ -n "$NEW_TAG" ]; then
            TAG="$NEW_TAG"
          elif [ "$REF_NAME" != "main" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v0.0.0"
          fi
          VERSION="${TAG#v}"
          echo "Injecting version: $VERSION"
          FILES=(
            "Cargo.toml"
            "README.md"
            "install.sh"
            "install.ps1"
            "site/app.js"
            "site/index.html"
            "crates/ox-cli/src/tui/render.rs"
            "docs/tutorials/01_getting_started.md"
          )
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              sed -i.bak "s/\b0\.0\.0\b/${VERSION}/g" "$file"
              rm -f "$file.bak"
            fi
          done

      - name: Build release binary (Standard)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --target ${{ matrix.target }} -p ox-cli

      - name: Build release binary (Cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }} -p ox-cli

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          NEW_TAG: ${{ needs.tag-release.outputs.new_tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ -n "$NEW_TAG" ]; then
            TAG="$NEW_TAG"
          elif [ "$REF_NAME" != "main" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v0.0.0"
          fi
          ARCHIVE_NAME="ox-${TAG}-${{ matrix.target }}"
          STAGE_DIR="stage/${ARCHIVE_NAME}"
          mkdir -p "${STAGE_DIR}"

          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${STAGE_DIR}/"
          cp README.md LICENSE NOTICE "${STAGE_DIR}/"

          tar -czf "${ARCHIVE_NAME}.tar.gz" -C stage "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

          echo "ASSET_ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          echo "ASSET_CHECKSUM=${ARCHIVE_NAME}.tar.gz.sha256" >> $GITHUB_ENV


      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NEW_TAG: ${{ needs.tag-release.outputs.new_tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if ($env:NEW_TAG) {
            $TAG = $env:NEW_TAG
          } elseif ($env:REF_NAME -ne "main" -and $env:REF_NAME) {
            $TAG = $env:REF_NAME
          } elseif ($env:INPUT_TAG) {
            $TAG = $env:INPUT_TAG
          } else {
            $TAG = "v0.0.0"
          }
          $ARCHIVE_NAME = "ox-$TAG-${{ matrix.target }}"
          $STAGE_DIR = "stage/$ARCHIVE_NAME"
          New-Item -ItemType Directory -Force -Path $STAGE_DIR | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $STAGE_DIR/
          Copy-Item README.md, LICENSE, NOTICE -Destination $STAGE_DIR/

          Compress-Archive -Path $STAGE_DIR -DestinationPath "${ARCHIVE_NAME}.zip" -Force
          $hash = (Get-FileHash -Path "${ARCHIVE_NAME}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${ARCHIVE_NAME}.zip" | Out-File -FilePath "${ARCHIVE_NAME}.zip.sha256" -Encoding ascii

          echo "ASSET_ARCHIVE=${ARCHIVE_NAME}.zip" >> $env:GITHUB_ENV
          echo "ASSET_CHECKSUM=${ARCHIVE_NAME}.zip.sha256" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET_ARCHIVE }}
            ${{ env.ASSET_CHECKSUM }}

  publish-release:
    name: Publish GitHub Release
    needs: [tag-release, build-release]
    if: always() && (needs.build-release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Files
        run: |
          ls -la release-assets/

      - name: Resolve Tag
        shell: bash
        env:
          NEW_TAG: ${{ needs.tag-release.outputs.new_tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ -n "$NEW_TAG" ]; then
            TAG="$NEW_TAG"
          elif [ "$REF_NAME" != "main" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v0.0.0"
          fi
          echo "RESOLVED_TAG=$TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RESOLVED_TAG }}
          name: ${{ env.RESOLVED_TAG }} — Minimalist & Secure Rust AI Agent
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*
