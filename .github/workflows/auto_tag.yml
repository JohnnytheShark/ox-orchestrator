name: Auto-Release on Merge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Execute Version Bump Script
        run: |
          chmod +x scripts/bump_version.sh
          ./scripts/bump_version.sh ${{ steps.tagger.outputs.new_tag }}

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: release ${{ steps.tagger.outputs.new_tag }} [skip ci]"
            git push origin main
          fi
          
          # Create and push the tag to trigger release.yml
          git tag ${{ steps.tagger.outputs.new_tag }}
          git push origin ${{ steps.tagger.outputs.new_tag }}
